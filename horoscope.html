<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horoscope Generator | AstroGPT</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --navy: #170d2b; --panel: #321957; --gold: #d6ad5c; --light: #fff8e7; --muted: #c9b9d8; --line: rgba(214,173,92,.3); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--light); background: radial-gradient(circle at 85% 10%, #4f2672 0, var(--navy) 42%); font: 15px/1.6 Inter, sans-serif; }
    main { width: min(1080px, calc(100% - 40px)); margin: auto; padding: 48px 0 72px; }
    a { color: var(--gold); text-decoration: none; }
    .back { display: inline-block; margin-bottom: 48px; font-size: 13px; }
    h1, h2 { font-family: "Cormorant Garamond", serif; font-weight: 600; }
    h1 { margin: 0; font-size: clamp(52px, 8vw, 92px); line-height: .9; }
    .intro { max-width: 600px; margin: 22px 0 42px; color: var(--muted); }
    .layout { display: grid; grid-template-columns: minmax(260px, .75fr) 1.25fr; gap: 18px; align-items: start; }
    .panel { padding: 28px; border: 1px solid var(--line); background: rgba(16,31,52,.78); }
    form { display: grid; gap: 17px; }
    label { display: grid; gap: 7px; color: var(--muted); font-size: 12px; }
    input { width: 100%; padding: 12px; border: 1px solid rgba(214,173,92,.28); background: #170d2b; color: var(--light); font: inherit; }
    button { padding: 13px 18px; border: 1px solid var(--gold); background: var(--gold); color: #10151c; font: 600 13px Inter, sans-serif; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .status { min-height: 24px; margin-top: 16px; color: var(--muted); font-size: 13px; }
    .results { display: none; }
    .results.visible { display: block; }
    .results h2 { margin: 0 0 18px; font-size: 38px; }
    .daily { margin-bottom: 22px; padding: 18px; border-left: 2px solid var(--gold); background: rgba(214,173,92,.08); }
    .daily h3 { margin: 0 0 7px; color: var(--gold); font: 600 24px "Cormorant Garamond", serif; }
    .daily p { margin: 0; color: var(--light); }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
    .metric { padding: 15px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.035); }
    .metric span { display: block; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
    .metric strong { display: block; margin-top: 7px; color: var(--gold); font-family: "Cormorant Garamond", serif; font-size: 22px; }
    .interpretation { margin-top: 22px; color: var(--muted); }
    @media (max-width: 720px) { main { width: min(100% - 28px, 560px); padding-top: 28px; } .back { margin-bottom: 34px; } .layout { grid-template-columns: 1fr; } .grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <main>
    <a class="back" href="/">← Back to AstroGPT</a>
    <h1>Horoscope<br><span>Generator</span></h1>
    <p class="intro">Enter birth details to generate a structured, educational Jyotisha profile.</p>
    <div class="layout">
      <section class="panel">
        <form id="horoscopeForm">
          <label>Name <input name="name" type="text" placeholder="Your name" minlength="2" autocomplete="name" required /></label>
          <label>Birth date <input name="birthDate" type="date" required /></label>
          <label>Birth time <input name="birthTime" type="time" required /></label>
          <label>Birth location <input name="location" type="text" placeholder="New Delhi" minlength="2" required /></label>
          <button type="submit">Generate profile</button>
        </form>
        <div class="status" id="status" role="status"></div>
      </section>
      <section class="panel results" id="results" aria-live="polite">
        <h2 id="profileTitle">Your Jyotisha Profile</h2>
        <div class="daily">
          <h3>Today's guidance <span id="dailyDate"></span></h3>
          <p id="dailyReading"></p>
        </div>
        <div class="grid" id="metrics"></div>
        <p class="interpretation" id="interpretation"></p>
      </section>
    </div>
  </main>
  <script>
    const form = document.getElementById("horoscopeForm");
    const status = document.getElementById("status");
    const results = document.getElementById("results");
    const metrics = document.getElementById("metrics");
    const interpretation = document.getElementById("interpretation");
    const profileTitle = document.getElementById("profileTitle");
    const dailyDate = document.getElementById("dailyDate");
    const dailyReading = document.getElementById("dailyReading");
    const savedProfile = localStorage.getItem("astrogpt-horoscope");

    if (savedProfile) {
      try {
        const saved = JSON.parse(savedProfile);
        Object.entries(saved.input || {}).forEach(([key, value]) => {
          const field = form.elements.namedItem(key);
          if (field) field.value = value;
        });
        if (saved.result) renderResult(saved.result);
      } catch {
        localStorage.removeItem("astrogpt-horoscope");
      }
    }

    function renderResult(data) {
      profileTitle.textContent = `${data.birthDetails.name}'s Jyotisha Profile`;
      dailyDate.textContent = `· ${data.dailyHoroscope.date}`;
      dailyReading.textContent = data.dailyHoroscope.reading;
      metrics.innerHTML = Object.entries(data.profile).map(([key, value]) => `<div class="metric"><span>${key}</span><strong>${value}</strong></div>`).join("");
      interpretation.textContent = data.interpretation;
      results.classList.add("visible");
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = form.querySelector("button");
      button.disabled = true;
      status.textContent = "Calculating profile...";
      try {
        const response = await fetch("/api/horoscope", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(Object.fromEntries(new FormData(form)))
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Unable to generate profile");
        const input = Object.fromEntries(new FormData(form));
        localStorage.setItem("astrogpt-horoscope", JSON.stringify({ input, result: data }));
        renderResult(data);
        status.textContent = "Profile generated.";
      } catch (error) {
        status.textContent = error.message;
        results.classList.remove("visible");
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
